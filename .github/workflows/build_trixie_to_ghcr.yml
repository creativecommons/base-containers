# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://docs.github.com/en/actions/reference/workflows-and-actions/variables
name: Build & push trixie to GHCR
# GHCR: GitHub Container Registry

on:
  push:
    branches: ["**"]
    paths:
      - '.github/workflows/build_to_ghcr.yml'
      - 'trixie/'
  workflow_dispatch:

env:
  OCI: org.opencontainers.image

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - parallel:

        # https://github.com/docker/login-action
        - name: Docker login to GitHub Container Registry (GHCR)
          # login-action v4.8.0
          uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        # https://github.com/docker/metadata-action
        - name: Docker extract metadata
          id: docker_meta
          # metadata-action v6.2.0
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
          with:
            flavor: 'latest=false'
            images: ghcr.io/creativecommons/trixie
            labels: |
              $OCI.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
            tags: |
              type=schedule,pattern={{date 'YYYYMMDD-HHmmss'}},value=latest,\
                ,enable={{is_default_branch}}
              type=sha,prefix={{branch}}-

        # https://github.com/docker/setup-buildx-action
        - name: Docker setup Buildx
          id: docker_buildx
          # setup-buildx-action v4.4.1
          uses: >-
            docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
          with:
            platforms: linux/amd64,linux/arm64


      # https://github.com/docker/build-push-action
      - name: Build and push Docker trixie image to GHCR
        # build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          builder: ${{ steps.docker_buildx.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: trixie/
          labels: ${{ steps.docker_meta.outputs.labels }}
          platforms: ${{ steps.docker_buildx.outputs.platforms }}
          provenance: false
          push: true
          sbom: false
          tags: ${{ steps.docker_meta.outputs.tags }}

# https://docs.docker.com/compose/compose-file/
# https://docs.docker.com/compose/how-tos/dependent-images/

name: ccbase

services:

  # Creative Commons Debian 13 (trixie) slim
  trixie:
    build:
      context: trixie/
    # disable the entrypoint as the image is only being built for use by
    # trixie-dev
    entrypoint: /bin/true
    image: trixie

  # Development overlay (local parent)
  trixie-dev:
    build:
      additional_contexts:
        trixie: "service:trixie"
      dockerfile_inline: |
        FROM trixie
        # https://docs.docker.com/build/building/best-practices/#apt-get
        # - Resynchronize the package index, update packages, install packages,
        #   and clean-up apt/dpkg
        RUN set -o errexit -o nounset \
            && DEBIAN_FRONTEND=noninteractive apt-get update \
                --no-allow-insecure-repositories --quiet \
            && DEBIAN_FRONTEND=noninteractive apt-get dist-upgrade \
                --no-install-recommends --no-install-suggests --quiet --yes \
            && DEBIAN_FRONTEND=noninteractive apt-get install \
                --no-install-recommends --no-install-suggests --quiet --yes \
                curl \
                httpie \
                ripgrep \
                tree \
                vim \
                wget \
            && DEBIAN_FRONTEND=noninteractive apt-get clean --quiet \
            && rm --recursive --force /var/lib/apt/lists/*
    command: /bin/sh -c '
      trap "exit" TERM;
      echo "Sleeping 💤";
      while true; do sleep 9 || break; done
      '
    env_file: .env
    restart: 'no'

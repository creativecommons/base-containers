# https://docs.docker.com/compose/compose-file/
# https://docs.docker.com/compose/how-tos/dependent-images/

name: base

services:

  # Creative Commons Debian 13 (trixie) slim
  trixie:
    build:
      context: trixie
    # disable the entrypoint as the image is only being built locally for use
    # by trixie-dev
    entrypoint: /bin/true
    image: trixie

  # Development overlay
  trixie-dev:
    build:
      additional_contexts:
        trixie: "service:trixie"
      context: trixie-dev
    command: sh -c 'echo "CMD ignored? (this should NOT show up in console)"'
    env_file: .env
